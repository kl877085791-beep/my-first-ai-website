<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #243047;
        }

        header {
            background: #ffffff;
            padding: 22px 35px;
            border-bottom: 1px solid #e5e9f0;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            color: #7b8495;
            margin-bottom: 0;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 25px 0;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
        }

        .card p {
            color: #7b8495;
            margin: 0 0 12px;
        }

        .card h2 {
            font-size: 30px;
            margin: 0;
        }

        .section-title {
            margin: 35px 0 18px;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 0;
            border-bottom: 1px solid #edf0f4;
        }

        .task label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .task input {
            width: 18px;
            height: 18px;
        }

        .completed {
            text-decoration: line-through;
            color: #9ba3b1;
        }

        .progress-bg {
            height: 10px;
            background: #e8edf5;
            border-radius: 10px;
            margin-top: 15px;
        }

        .progress-fill {
            height: 10px;
            width: 0%;
            background: #3978e8;
            border-radius: 10px;
            transition: width 0.3s;
        }

        button {
            background: #3978e8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #245fc5;
        }

        @media (max-width: 650px) {
            .stats {
                grid-template-columns: 1fr;
            }

            main {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Project Management Dashboard</h1>
    <p>Manage your projects and track your progress.</p>
</header>

<main>

    <h2>Project Overview</h2>
    <p>Welcome back! Here is your project summary.</p>

    <div class="stats">

        <div class="card">
            <p>Total Projects</p>
            <h2>5</h2>
        </div>

        <div class="card">
            <p>Active Tasks</p>
            <h2 id="activeTasks">3</h2>
        </div>

        <div class="card">
            <p>Completed Tasks</p>
            <h2 id="completedTasks">0</h2>
        </div>

    </div>

    <div class="card">

        <h2 class="section-title">Task Progress</h2>

        <p id="progressText">0% Completed</p>

        <div class="progress-bg">
            <div class="progress-fill" id="progressBar"></div>
        </div>

    </div>

    <div class="card">

        <h2 class="section-title">My Tasks</h2>

        <div id="taskList">

            <div class="task">
                <label>
                    <input type="checkbox" onchange="updateProgress()">
                    <span>Website Design</span>
                </label>
            </div>

            <div class="task">
                <label>
                    <input type="checkbox" onchange="updateProgress()">
                    <span>Project Planning</span>
                </label>
            </div>

            <div class="task">
                <label>
                    <input type="checkbox" onchange="updateProgress()">
                    <span>Development</span>
                </label>
            </div>

        </div>

        <button onclick="addTask()">+ Add Task</button>

    </div>

</main>

<script>

    function updateProgress() {

        const tasks = document.querySelectorAll(
            '#taskList input[type="checkbox"]'
        );

        const completed = document.querySelectorAll(
            '#taskList input[type="checkbox"]:checked'
        );

        const total = tasks.length;
        const done = completed.length;

        const percentage = total === 0
            ? 0
            : Math.round((done / total) * 100);

        document.getElementById('completedTasks').textContent = done;

        document.getElementById('activeTasks').textContent =
            total - done;

        document.getElementById('progressText').textContent =
            percentage + '% Completed';

        document.getElementById('progressBar').style.width =
            percentage + '%';

        tasks.forEach(task => {
            task.nextElementSibling.classList.toggle(
                'completed',
                task.checked
            );
        });
    }

    function addTask() {

        const taskName = prompt('Enter a new task:');

        if (!taskName || !taskName.trim()) {
            return;
        }

        const task = document.createElement('div');

        task.className = 'task';

        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        const span = document.createElement('span');

        checkbox.type = 'checkbox';
        checkbox.addEventListener('change', updateProgress);

        span.textContent = taskName.trim();

        label.appendChild(checkbox);
        label.appendChild(span);
        task.appendChild(label);

        document.getElementById('taskList').appendChild(task);

        updateProgress();
    }

    updateProgress();

</script>

</body>
</html>
